<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">Charlie ThePoo</h1>
      <button id="cart-toggle" class="cart-toggle">
        My Cart <span id="cart-count"> (0) </span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h2>Charlie The Poo's Exclusive Line</h2>
      <p>Business cards, posters, canvas prints, stickers — shipped to your door.</p>
    </section>

    <section id="product-grid" class="product-grid">
      <!-- products injected by app.js -->
      <p class="loading">Loading products…</p>
    </section>
  </main>

  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h2>Your Cart</h2>
      <button id="cart-close">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">
        Total: <span id="cart-total">$0.00</span>
      </div>
      <div id="paypal-button-container"></div>
      <p id="checkout-message" class="checkout-message"></p>
    </div>
  </aside>
  <div id="cart-backdrop" class="cart-backdrop"></div>

  <footer class="site-footer">
    <p>&copy; 2026 Print Shop. Payments securely processed by PayPal.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
